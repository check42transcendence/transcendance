name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared:
    name: Shared checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build shared package
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test


  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: transcendence
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: transcendence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcendence -d transcendence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://transcendence:ci_only@localhost:5432/transcendence_test
      TEST_DATABASE_URL: postgresql://transcendence:ci_only@localhost:5432/transcendence_test
      JWT_SECRET: ci-only-secret-for-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build shared package
        working-directory: shared
        run: |
          npm ci
          npm run build
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Prepare database integration tests
        run: npm run test:db:prepare

      - name: Database integration tests
        run: npm run test:db

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - shared
      - frontend
      - backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate local TLS certificate
        run: sh scripts/generate-local-cert.sh

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and start application
        run: >
          docker compose
          --env-file .env.example
          up --build --detach --wait --wait-timeout 120

      - name: Verify HTTP redirect
        run: |
          result="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' \
              'http://localhost:8080/api/health?check=ci'
          )"

          test "$result" = '308 https://localhost:8443/api/health?check=ci'

      - name: Verify frontend over HTTPS
        run: >
          curl
          --cacert certs/localhost.crt
          --fail
          --show-error
          --silent
          https://localhost:8443/
          > /dev/null

      - name: Verify backend through HTTPS gateway
        run: |
          response="$(
            curl \
              --cacert certs/localhost.crt \
              --fail \
              --show-error \
              --silent \
              https://localhost:8443/api/health
          )"

          test "$response" = '{"status":"ok"}'

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.example ps

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Shut down application
        if: always()
        run: >
          docker compose
          --env-file .env.example
          down --volumes --remove-orphans

  e2e:
    name: Browser E2E checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - shared
      - frontend
      - backend

    env:
      COMPOSE_PROJECT_NAME: transcendence-e2e
      COMPOSE_FILE: compose.e2e.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate local TLS certificate
        run: sh scripts/generate-local-cert.sh

      - name: Validate E2E configuration
        run: docker compose --env-file .env.e2e.example config --quiet

      - name: Build and start test application
        run: >
          docker compose --env-file .env.e2e.example
          up --build --detach --wait --wait-timeout 120
          backend frontend

      - name: Run browser tests
        run: >
          docker compose --env-file .env.e2e.example
          run --build --rm --no-deps -T e2e

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.e2e.example ps --all

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.e2e.example logs --no-color

      - name: Upload failure records
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: auth-e2e-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Shut down test environment
        if: always()
        run: >
          docker compose --env-file .env.e2e.example
          down --volumes --remove-orphans
