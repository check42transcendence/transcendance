name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend
      - backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and start application
        run: >
          docker compose
          --env-file .env.example
          up --build --detach --wait --wait-timeout 120

      - name: Verify frontend
        run: >
          curl
          --fail
          --show-error
          --silent
          http://127.0.0.1:8080/
          > /dev/null

      - name: Verify backend through gateway
        run: |
          response="$(
            curl \
              --fail \
              --show-error \
              --silent \
              http://127.0.0.1:8080/api/health
          )"

          test "$response" = '{"status":"ok"}'

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.example ps

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Shut down application
        if: always()
        run: >
          docker compose
          --env-file .env.example
          down --volumes --remove-orphans
